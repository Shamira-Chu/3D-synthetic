<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var customFetch = origFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || origFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customFetch || origFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
